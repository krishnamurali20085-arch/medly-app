name: medly
description: Smart Emergency Healthcare Assistant
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  google_maps_flutter: ^2.8.1
  geolocator: ^13.0.0
  flutter_local_notifications: ^17.0.0
  http: ^1.5.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.2.0
  permission_handler: ^11.0.0
  sqflite: ^2.3.0
  path: ^1.8.0
  supabase_flutter: ^2.8.0
  pedometer: ^4.0.2
  timezone: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/medly_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/medly_logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/medly_logo.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
